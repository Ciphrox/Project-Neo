    </rect></clipPath>
    <clipPath id="typeCalc"><rect x="610" y="298" width="0" height="20">
      <animate attributeName="width" values="0;6.6;13.2;19.8;26.4;33;39.6;46.2;52.8;59.4;66;72.6;79.2;85.8;92.4;99;105.6;112.2;112.2;0;0" calcMode="discrete" keyTimes="0;0.46;0.478;0.496;0.514;0.532;0.55;0.568;0.586;0.604;0.622;0.64;0.658;0.676;0.694;0.712;0.73;0.748;0.77;0.775;1" dur="6s" repeatCount="1" fill="freeze"/>
