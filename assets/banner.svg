    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#25d366" stop-opacity="0.15"/>
      <stop offset="0.35" stop-color="#25d366" stop-opacity="0.08"/>
      <stop offset="0.7" stop-color="#25d366" stop-opacity="0.03"/>
